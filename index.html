<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boletim Digital - 8º Ano</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">
        <!-- Cabeçalho do Boletim -->
        <header class="header">
            <h1>Boletim Digital</h1>
            <p class="subtitle">Estudante Exemplo • 8º Ano</p>
        </header>

        <!-- Área de Cards de Resumo -->
        <section class="cards-grid">
            <div class="card">
                <h3>Média Geral</h3>
                <p id="card-media" class="card-value">—</p>
            </div>
            <div class="card">
                <h3>Total de Faltas</h3>
                <p id="card-faltas" class="card-value">—</p>
            </div>
            <div class="card">
                <h3>Bom Desempenho</h3>
                <p id="card-bom-desempenho" class="card-value">—</p>
            </div>
            <div class="card">
                <h3>Atenção</h3>
                <p id="card-atencao" class="card-value">—</p>
            </div>
            <div class="card">
                <h3>Frequência</h3>
                <p id="card-frequencia" class="card-value">—</p>
                <span class="card-subtext">Frequência adequada</span>
            </div>
        </section>

        <!-- Tabela Responsiva com as Disciplinas -->
        <section class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Disciplina</th>
                        <th>1º Tri</th>
                        <th>2º Tri</th>
                        <th>3º Tri</th>
                        <th>Média</th>
                        <th>Faltas</th>
                        <th>Situação</th>
                    </tr>
                </thead>
                <!-- O corpo da tabela será preenchido automaticamente pelo JavaScript -->
                <tbody id="tabela-corpo">
                </tbody>
            </table>
        </section>
    </div>

    <script src="script.js"></script>
</body>

</html>
